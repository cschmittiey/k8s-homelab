---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app forgejo-runner
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    controllers:
      forgejo-runner:
        replicas: 2
        initContainers:
          runner-register:
            image:
              repository: code.forgejo.org/forgejo/runner
              tag: 13.0.0
            command:
              - "forgejo-runner"
              - "register"
              - "--no-interactive"
              - "--token"
              - $(RUNNER_TOKEN)
              - "--name"
              - $(RUNNER_NAME)
              - "--instance"
              - $(FORGEJO_INSTANCE_URL)
              - "--labels"
              # The nix/lix images are digest-pinned. That is load-bearing, not
              # hygiene: job containers share a persistent nix cache, so the
              # image's own /nix/store must not shift underneath it. Pinning
              # also opts them into Renovate — see the `Forgejo runner labels`
              # customManager in .github/renovate.json5, which matches exactly
              # the `docker://image:tag@sha256:...` shape and leaves the
              # unpinned labels below alone.
              - "docker:docker://node:20-bookworm,node20:docker://node:20-bookworm,ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-20.04,ubuntu-22.04:docker://ghcr.io/catthehacker/ubuntu:act-22.04,ubuntu-24.04:docker://ghcr.io/catthehacker/ubuntu:act-24.04,nix-latest:docker://ghcr.io/joschi/forgejo-nix:latest@sha256:bc049a99be3cc8ea903c6d3e4597099b9544a8ef238c1f6624ddd6dd041ef20a,lix-latest:docker://ghcr.io/joschi/forgejo-lix:latest@sha256:d143755842b630e64a931d77b04a84a220eab0f9319a054b82be6042da8af493"
            env:
              - name: RUNNER_NAME
                valueFrom:
                  secretKeyRef:
                    name: forgejo-runner-secret
                    key: RUNNER_NAME
              - name: RUNNER_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: forgejo-runner-secret
                    key: RUNNER_TOKEN
              - name: FORGEJO_INSTANCE_URL
                valueFrom:
                  secretKeyRef:
                    name: forgejo-runner-secret
                    key: FORGEJO_INSTANCE_URL
        containers:
          daemon:
            image:
              repository: docker
              tag: 29.7.2-dind
            securityContext:
              privileged: true
            env:
              - name: DOCKER_TLS_CERTDIR
                value: /certs
          app:
            image:
              repository: code.forgejo.org/forgejo/runner
              tag: 13.0.0
            command:
              - "sh"
              - "-c"
              - "while ! nc -z localhost 2376 </dev/null; do echo 'waiting for docker daemon...'; sleep 5; done; forgejo-runner --config /config/config.yml daemon"
            env:
              - name: DOCKER_HOST
                value: tcp://localhost:2376
              - name: DOCKER_CERT_PATH
                value: /certs/client
              - name: DOCKER_TLS_VERIFY
                value: "1"
        annotations:
          reloader.stakater.com/auto: "true"
    service:
      app:
        controller: forgejo-runner
        ports:
          http:
            port: 45315
    persistence:
      docker-certs:
        type: emptyDir
        globalMounts:
          - path: /certs
      runner-data:
        type: emptyDir
        globalMounts:
          - path: /data
      # Shared nix binary cache for job containers.
      #
      # Mounted into `daemon` ONLY. dind is what creates job containers, so the
      # `-v /nix-cache:/nix-cache` in runner-config.yaml's container.options
      # resolves against dind's filesystem — a mount into `app` (or onto the
      # node) would be invisible to jobs.
      #
      # Contention is bounded: 2 replicas x capacity 1 = at most 2 concurrent
      # writers, and the contents are inert NARs rather than a nix store. A
      # torn concurrent write fails its narinfo hash check on read and nix
      # falls back to cache.nixos.org, so the worst case is a cache miss.
      nix-cache:
        existingClaim: forgejo-runner-nix-cache
        advancedMounts:
          forgejo-runner:
            daemon:
              - path: /nix-cache
      # The shared secret for the external cache server, as a file so
      # runner-config.yaml can reach it via cache.secret_url — the runner
      # config itself is a ConfigMap and therefore plaintext in git. Only the
      # runner process needs it; the dind sidecar does not.
      cache-secret:
        type: secret
        name: forgejo-runner-secret
        advancedMounts:
          forgejo-runner:
            app:
              - path: /secrets/cache-secret
                subPath: CACHE_SECRET
                readOnly: true
      config:
        type: configMap
        name: forgejo-runner-configmap
        globalMounts:
          - path: /config/config.yml
            subPath: config.yml
            readOnly: true
