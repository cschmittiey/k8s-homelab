---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./cnpg.yaml
  - ./podmonitor.yaml
  - ./secret.sops.yaml
configMapGenerator:
  - name: firecrawl-nuq-schema
    files:
      - ./nuq.sql
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # Preserve PostgreSQL dollar-quoted strings during Flux post-build
    # substitution; otherwise every `$$` is collapsed to `$`.
    kustomize.toolkit.fluxcd.io/substitute: disabled
