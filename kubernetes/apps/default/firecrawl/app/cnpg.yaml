---
apiVersion: postgresql.cnpg.io/v1
kind: ImageCatalog
metadata:
  name: firecrawl-nuq-postgres
  namespace: default
spec:
  images:
    - major: 17
      # Firecrawl's NuQ image is PostgreSQL 17 plus pg_cron. The project only
      # publishes a rolling tag, so keep the reviewed manifest immutable.
      # renovate: datasource=docker depName=ghcr.io/firecrawl/nuq-postgres
      image: ghcr.io/firecrawl/nuq-postgres:latest@sha256:aed86f62858f29bd971abddcdeb301c12888098d2cf5d33c1ba42b053bc460f6
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: firecrawl
  namespace: default
spec:
  instances: 1
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ImageCatalog
    name: firecrawl-nuq-postgres
    major: 17
  # The upstream image is based on the official postgres image rather than
  # CloudNativePG's UID-26 image.
  postgresUID: 999
  postgresGID: 999

  storage:
    storageClass: longhorn
    size: 10Gi

  bootstrap:
    initdb:
      database: firecrawl
      owner: firecrawl
      secret:
        name: firecrawl
      # This runs only while creating a fresh cluster. Future Firecrawl
      # releases that change NuQ's schema need an explicit migration.
      postInitApplicationSQLRefs:
        configMapRefs:
          - name: firecrawl-nuq-schema
            key: nuq.sql

  postgresql:
    shared_preload_libraries:
      - pg_cron
    parameters:
      # The upstream image targets postgres in postgresql.conf.sample. CNPG
      # owns the effective config, so point pg_cron at the application DB.
      cron.database_name: firecrawl
      # CNPG does not give pg_cron passwordless local TCP access. Background
      # workers run jobs as the scheduling role without a second connection.
      cron.use_background_workers: "on"

  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      memory: 2Gi
